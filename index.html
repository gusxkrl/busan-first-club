function render(){const logged=!!user;$('authBox').hidden=logged;$('signedBox').hidden=!logged;$('who').textContent=me?me.name+' · '+(isAdmin()?'관리자':me.approved?'승인 회원':'승인 대기'):logged?'회원 정보 확인 중':'로그인이 필요합니다';$('signedName').textContent=me?.name||user?.email||'';message(!logged?'로그인 후 기록을 확인할 수 있습니다.':!me?'회원 정보가 없습니다. 관리자에게 문의해 주세요.':!approved()?'가입 신청 상태입니다. 관리자 승인 후 점수를 입력할 수 있습니다.':'정기전 점수를 확인하고 입력할 수 있습니다.');
const month=$('period').value==='month',sort=$('sort').value,ranked=members.filter(m=>m.approved).map(m=>({m,s:stat(m,month)})).sort((a,b)=>b.s[sort]-a.s[sort]||a.m.name.localeCompare(b.m.name));
$('rankingList').innerHTML='<div class="rank"><b>회원</b><b>1G</b><b>2G</b><b>3G</b><b>AVG</b></div>'+ranked.map(({m,s},i)=>{const latest=scores.filter(r=>r.member_id===m.id).sort((a,b)=>scoreDate(b).localeCompare(scoreDate(a)))[0],lv=latest?gameValues(latest):[];return '<div class="rank"><span>'+(i+1)+'위 <button type="button" class="member-name" data-member-profile="'+esc(m.id)+'">'+esc(m.name)+'</button><small class="muted"> ('+s.games+'G)</small></span>'+[1,2,3].map(j=>'<span>'+(lv[j-1]??'—')+'</span>').join('')+'<strong>'+(s.games?s.avg.toFixed(1):'—')+'</strong></div>'}).join('');
const old=$('eventSelect').value;$('eventSelect').innerHTML=events.slice().sort((a,b)=>dateOf(b).localeCompare(dateOf(a))).map(e=>'<option value="'+e.id+'">'+esc(dateOf(e))+' · '+(e.event_type==='lightning'?'벙개':'정기전')+'</option>').join('');if(events.some(e=>String(e.id)===old))$('eventSelect').value=old;
$('entryInfo').textContent=!approved()?'관리자 승인이 필요합니다.':'날짜, 정기전/벙개, 게임 수를 정하세요. 같은 날짜와 구분의 기록은 수정됩니다.';$('saveBtn').disabled=!approved();
const own=me?scores.filter(s=>s.member_id===me.id):[],s=me?stat(me):{avg:0,games:0,total:0};$('myStats').innerHTML=[['에버리지',s.avg.toFixed(1)],['게임수',s.games],['총핀',s.total]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');$('myHistory').innerHTML=own.slice().sort((a,b)=>scoreDate(b).localeCompare(scoreDate(a))).map(r=>'<div class="row"><span>'+esc(scoreDate(r))+' · '+gameValues(r).join(' / ')+'</span><button class="alt" data-edit="'+r.event_id+'">수정</button></div>').join('');

$('roleManager').hidden=!(me&&me.is_superadmin===true);$('resetPasswordCard').hidden=!(me&&me.is_superadmin===true);if(me?.is_superadmin){$('resetMember').innerHTML=members.filter(m=>m.approved&&!m.is_superadmin).map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('')}
$('roleList').innerHTML=(me&&me.is_superadmin===true)?members.filter(m=>m.approved&&!m.is_superadmin).map(m=>'<div class="row"><span>'+esc(m.name)+' · '+(m.is_admin?'관리자':'일반회원')+'</span><button class="alt" data-role="'+esc(m.id)+'" data-make-admin="'+(!m.is_admin)+'">'+(m.is_admin?'관리자 해제':'관리자 지정')+'</button></div>').join('')||'<p class="muted">지정 가능한 회원이 없습니다.</p>':'';
$('adminScores').innerHTML=isAdmin()?scores.map(r=>'<div class="row"><span>'+esc(members.find(m=>m.id===r.member_id)?.name||'회원')+' · '+esc(scoreDate(r))+'<small class="muted"> '+gameValues(r).join('/')+'</small></span><button class="alt" data-admin="'+r.member_id+'|'+r.event_id+'">수정</button></div>').join(''):'<p class="muted">관리자 전용</p>';

function showMemberProfile(id){
 const m=members.find(x=>x.id===id&&x.approved);if(!m)return;
 const category=(type)=>{const rows=scores.filter(x=>x.member_id===id&&eventById(x.event_id)?.event_type===type);const total=rows.reduce((a,r)=>a+gameValues(r).reduce((n,v)=>n+v,0),0);const games=rows.reduce((n,r)=>n+gameValues(r).length,0);return{attend:new Set(rows.map(r=>r.event_id)).size,games,total,avg:games?(total/games).toFixed(1):'—'}};
 const panel=(title,x)=>'<div class="profile-section"><h3>'+title+'</h3><div class="profile-metrics">'+[['참석 횟수',x.attend+'회'],['게임 수',x.games+'게임'],['총점',x.total.toLocaleString()+'점'],['평균 에버리지',x.avg]].map(a=>'<div><small>'+a[0]+'</small><strong>'+a[1]+'</strong></div>').join('')+'</div></div>';

async function refresh(){if(!db)return;fail('');try{const {data,error}=await db.auth.getUser();if(error&&error.message!=='Auth session missing!')fail('인증 확인: '+error.message);user=data?.user||null;if(!user){me=null;members=[];events=[];scores=[];render();return}const p=await db.from('club_members').select('*').eq('id',user.id).maybeSingle();if(p.error)fail('회원 조회: '+p.error.message);me=p.data;const [m,e,s]=await Promise.all([db.from('club_members').select('*'),db.from('club_events').select('*'),db.from('club_scores').select('*')]);members=m.data||[];events=e.data||[];scores=s.data||[];

 const lb=await db.rpc('club_member_directory');

async function signIn(){if(!db)return alert('서버 연결 중입니다. 잠시 후 다시 시도하세요.');const id=phone($('loginId').value),password=$('loginPassword').value;if(!/^01[016789][0-9]{7,8}$/.test(id))return alert('휴대전화 번호를 확인하세요.');if(!password)return alert('비밀번호를 입력하세요.');const email=id==='01092240218'?'arquaron@gmail.com':emailForPhone(id);const r=await db.auth.signInWithPassword({email,password});if(r.error)return alert('로그인 실패: 전화번호 또는 비밀번호를 확인하세요.');await refresh()}
async function signUp(){if(!db)return alert('서버 연결 중입니다.');const name=$('joinName').value.trim(),p=phone($('joinPhone').value),password=$('joinPassword').value;if(name.length<2||!/^01[016789][0-9]{7,8}$/.test(p)||password.length<8)return alert('이름, 휴대전화 번호, 8자 이상 비밀번호를 확인하세요.');const r=await db.auth.signUp({email:emailForPhone(p),password,options:{data:{name,phone:p}}});if(r.error)return alert('가입 신청 실패: '+r.error.message);if(!r.data.session)return alert('계정은 생성됐지만 이메일 확인이 켜져 있습니다. 관리자에게 설정 변경을 요청하세요.');const save=await db.from('club_members').insert({id:r.data.user.id,name,phone:p,approved:false,is_admin:false,is_superadmin:false});if(save.error)return alert('계정 생성됨, 회원 정보 등록 실패: '+save.error.message);alert('가입 신청 완료! 관리자 승인 후 점수를 입력할 수 있습니다.');await refresh()}
async function save(){if(!approved())return alert('승인된 회원만 입력할 수 있습니다.');const date=$('scoreDate').value,type=$('scoreType').value,a=chosenGames();if(!date||!['regular','lightning'].includes(type)||!a.length||a.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>300))return alert('날짜, 구분, 게임별 점수(0~300)를 확인하세요.');const ev=await db.rpc('club_get_or_create_event',{p_date:date,p_type:type});if(ev.error)return alert('경기 등록 실패: '+ev.error.message);const eid=ev.data,nums=a.map(Number),payload={game_scores:nums,game1:nums[0]??null,game2:nums[1]??null,game3:nums[2]??null},exists=scores.some(s=>s.member_id===me.id&&String(s.event_id)===String(eid));const r=exists?await db.from('club_scores').update(payload).eq('member_id',me.id).eq('event_id',eid):await db.from('club_scores').insert({...payload,member_id:me.id,event_id:eid});if(r.error)return alert('저장 실패: '+r.error.message);await refresh();switchTab('ranking');alert('점수가 저장됐습니다.')}
async function approve(id){if(!isAdmin())return;const r=await db.from('club_members').update({approved:true}).eq('id',id);if(r.error)return alert('승인 실패: '+r.error.message);await refresh();alert('승인 완료')}

async function adminScore(id,eid){if(!isAdmin())return;const old=scores.find(s=>s.member_id===id&&String(s.event_id)===String(eid));if(!old)return;const input=prompt('게임 점수를 쉼표로 구분 (1~12게임)',gameValues(old).join(','));if(input===null)return;const a=input.split(',').map(x=>x.trim());if(a.length<1||a.length>12||a.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>300))return alert('0~300점, 1~12게임을 입력하세요.');const nums=a.map(Number),r=await db.from('club_scores').update({game_scores:nums,game1:nums[0]??null,game2:nums[1]??null,game3:nums[2]??null}).eq('member_id',id).eq('event_id',eid);if(r.error)return alert('수정 실패: '+r.error.message);await refresh();alert('수정 완료')}
async function changeAdminRole(id,makeAdmin){if(!me?.is_superadmin)return alert('최고관리자 전용입니다.');const target=members.find(m=>m.id===id);if(!target)return;const action=makeAdmin?'관리자로 지정':'관리자 권한 해제';if(!confirm(target.name+' 회원을 '+action+'할까요?'))return;const r=await db.rpc('set_club_admin',{target_member:id,make_admin:makeAdmin});if(r.error)return alert('변경 실패: '+r.error.message);await refresh();alert('변경 완료')}
async function resetMemberPassword(){if(!me?.is_superadmin)return alert('최고관리자 전용입니다.');const id=$('resetMember').value,pw=$('resetNewPassword').value;if(!id||pw.length<12)return alert('회원과 12자 이상 임시 비밀번호를 확인하세요.');if(!confirm('선택한 회원의 비밀번호를 초기화할까요?'))return;const {data:sessionData}=await db.auth.getSession();const token=sessionData?.session?.access_token;if(!token)return alert('다시 로그인해 주세요.');try{const res=await fetch(SUPABASE_URL+'/functions/v1/club-reset-password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':KEY},body:JSON.stringify({member_id:id,new_password:pw})});const result=await res.json();if(!res.ok)return alert(result.message||'초기화 실패');$('resetNewPassword').value='';alert('비밀번호 초기화 완료! 회원에게 임시 비밀번호를 안전하게 전달해 주세요.')}catch(e){alert('서버 연결 실패: '+e.message)}}
function bind(){$('resetPasswordBtn').onclick=resetMemberPassword;$('roleList').onclick=e=>{const b=e.target.closest('[data-role]');if(b)changeAdminRole(b.dataset.role,b.dataset.makeAdmin==='true')};$('rankingList').addEventListener('click',e=>{const b=e.target.closest('[data-member-profile]');if(b)showMemberProfile(b.dataset.memberProfile)});$('closeMemberProfile').onclick=closeMemberProfile;$('memberProfileOverlay').onclick=e=>{if(e.target.id==='memberProfileOverlay')closeMemberProfile()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMemberProfile()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('loginBtn').onclick=signIn;$('joinBtn').onclick=signUp;$('logoutBtn').onclick=async()=>{await db?.auth.signOut();await refresh()};$('period').onchange=render;$('sort').onchange=render;$('scoreDate').onchange=loadSelectedScore;$('scoreType').onchange=loadSelectedScore;$('gameCount').onchange=()=>buildGameInputs(chosenGames());$('saveBtn').onclick=save;$('profileBtn').onclick=async()=>{if(!me)return;const r=await db.from('club_members').update({phone_public:$('phonePublic').value==='true'}).eq('id',me.id);if(r.error)return alert(r.error.message);await refresh();alert('저장 완료')};$('pending').onclick=e=>{const b=e.target.closest('[data-approve]');if(b)approve(b.dataset.approve)};$('adminScores').onclick=e=>{const b=e.target.closest('[data-admin]');if(b){const [id,eid]=b.dataset.admin.split('|');adminScore(id,eid)}};$('myHistory').onclick=e=>{const b=e.target.closest('[data-edit]');if(b){switchTab('entry');(()=>{const e=eventById(b.dataset.edit);if(e){$('scoreDate').value=dateOf(e);$('scoreType').value=e.event_type}loadSelectedScore()})()}}}
function loadSdk(urls,i=0){if(i>=urls.length){fail('로그인 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}const s=document.createElement('script');s.src=urls[i];s.crossOrigin='anonymous';s.onload=()=>{try{if(!window.supabase?.createClient)return loadSdk(urls,i+1);db=window.supabase.createClient(SUPABASE_URL,KEY);db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(refresh,0)});refresh()}catch(e){fail('로그인 연결 오류: '+e.message)}};s.onerror=()=>loadSdk(urls,i+1);document.head.appendChild(s)}
window.addEventListener('error',e=>{if(e.message==='Script error.')return;fail('화면 오류: '+(e.message||'알 수 없는 오류'))});window.addEventListener('unhandledrejection',e=>fail('처리 오류: '+(e.reason?.message||String(e.reason))));$('scoreDate').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);buildGameInputs();bind();render();message('로그인 서버 연결 중...');loadSdk(['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js']);
</script></body></html>
