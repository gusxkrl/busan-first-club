<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산 퍼스트클럽</title><meta name="theme-color" content="#102b55"><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#162b48;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#102b55;color:white;padding:24px 18px;border-radius:0 0 22px 22px}header>div,main{max-width:590px;margin:auto}h1{font-size:25px;margin:5px 0}h2{font-size:18px;margin:0 0 14px}.wrap{padding:16px 14px 80px}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 3px 15px #102b5514}input,button,select{font:inherit}input,select{width:100%;padding:12px;border:1px solid #cbd6e6;border-radius:10px;margin:6px 0 13px}button{border:0;border-radius:10px;background:#175bb8;color:#fff;padding:12px;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#e9eff9;color:#193c6d}label{font-size:13px;font-weight:700}.muted{font-size:13px;color:#68758a}.notice{padding:13px;background:#fff3d6;border-radius:12px;font-size:13px;white-space:pre-wrap}.error{color:#b42318;white-space:pre-wrap;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.row button{white-space:nowrap}.tabs{display:flex;gap:5px;overflow-x:auto;margin:15px 0}.tabs button{white-space:nowrap;font-size:12px;flex:1;padding:11px 7px}.tabs button.active{background:#102b55}section{display:none}section.active{display:block}.flex{display:flex;gap:8px}.flex>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf4fd;text-align:center;padding:12px 4px;border-radius:12px}.stat strong{display:block;font-size:19px}.rank{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:3px;font-size:12px;padding:12px 0;border-bottom:1px solid #edf0f5;text-align:center}.rank span:first-child{text-align:left}details{margin-top:15px}summary{font-weight:700;cursor:pointer}[hidden]{display:none!important}
</style></head><body><header><div><small>BUSAN 1ST BOWLING CLUB</small><h1>🎳 부산 퍼스트클럽</h1><div id="who">연결 중...</div></div></header><main class="wrap"><div id="notice" class="notice">준비 중...</div><div id="error" class="error" role="alert"></div>
<div class="card" id="authBox"><h2>회원 로그인</h2><label>휴대전화 번호</label><input id="loginId" inputmode="email" autocomplete="username" placeholder="01012345678"><label>비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="loginBtn" style="width:100%">로그인</button><details><summary>처음이세요? 회원 가입 신청</summary><p class="muted">이메일 인증 없이 신청하고, 관리자 승인 후 점수를 입력할 수 있습니다.</p><label>이름</label><input id="joinName" autocomplete="name" placeholder="실명"><label>휴대전화 번호</label><input id="joinPhone" type="tel" placeholder="01012345678"><label>비밀번호 (8자 이상)</label><input id="joinPassword" type="password" autocomplete="new-password"><button id="joinBtn" style="width:100%">가입 신청</button></details><details><summary>기존 관리자 이메일 로그인</summary><p class="muted">기존 관리자 계정 보존을 위한 로그인</p><input id="legacyEmail" type="email" placeholder="기존 이메일"><button class="alt" id="legacyBtn">기존 이메일로 로그인</button></details></div>
<div class="card" id="signedBox" hidden><div class="row"><strong id="signedName"></strong><button class="alt" id="logoutBtn">로그아웃</button></div></div>
<nav class="tabs"><button data-tab="ranking" class="active">전체 순위</button><button data-tab="entry">점수 입력</button><button data-tab="history">개인 기록</button><button data-tab="profile">프로필</button><button data-tab="manage">관리</button></nav>
<section id="ranking" class="active"><div class="card"><h2>전체 회원 순위</h2><div class="flex"><select id="period"><option value="all">전체 기간</option><option value="month">이번 달</option></select><select id="sort"><option value="avg">에버리지순</option><option value="total">총핀순</option><option value="games">게임수순</option><option value="attend">참석횟수순</option></select></div><div id="rankingList"></div></div></section>
<section id="entry"><div class="card"><h2>내 점수 입력·수정</h2><p class="muted" id="entryInfo"></p><label>정기전 선택</label><select id="eventSelect"></select><div class="flex"><div><label>1게임</label><input id="g1" type="number" min="0" max="300"></div><div><label>2게임</label><input id="g2" type="number" min="0" max="300"></div><div><label>3게임</label><input id="g3" type="number" min="0" max="300"></div></div><p>에버리지: <strong id="preview">—</strong></p><button id="saveBtn" style="width:100%">점수 저장 · 순위 반영</button></div></section>
<section id="history"><div class="card"><h2>내 기록</h2><div id="myStats" class="grid"></div><div id="myHistory"></div></div></section>
<section id="profile"><div class="card"><h2>내 프로필</h2><label>전화번호</label><input id="phone" type="tel" readonly><label>다른 회원에게 연락처 공개</label><select id="phonePublic"><option value="false">비공개</option><option value="true">공개</option></select><button id="profileBtn">프로필 저장</button></div></section>
<section id="manage"><div class="card"><h2>회원 승인</h2><div id="pending"></div></div><div class="card"><h2>정기전 등록</h2><label>날짜</label><input id="newDate" type="date"><label>구분</label><select id="newType"><option value="regular">정기전</option><option value="lightning">번개전</option></select><button id="newEventBtn">정기전 등록</button></div><div class="card"><h2>전체 회원 점수 수정</h2><div id="adminScores"></div></div></section></main>
<script>
'use strict';
const SUPABASE_URL='https://vgcxhwrnedmzlmbzjext.supabase.co',KEY='sb_publishable_gNdMi8-eDPjfCrq1-txE6A_DMZxH6KJ';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,user=null,me=null,members=[],events=[],scores=[],tab='ranking';
const phone=v=>String(v||'').replace(/\D/g,'');
const emailForPhone=p=>phone(p)+'@members.busan-first.example.com';
const isAdmin=()=>!!(me&&(me.is_admin||me.is_superadmin));
const approved=()=>!!(me&&(me.approved||isAdmin()));
const dateOf=e=>String(e?.event_date||'').slice(0,10);
const eventById=id=>events.find(e=>String(e.id)===String(id));
const scoreDate=s=>dateOf(eventById(s.event_id));
const message=v=>$('notice').textContent=v;
const fail=v=>$('error').textContent=v||'';
function stat(m,month=false){const ym=new Date().toISOString().slice(0,7),rows=scores.filter(s=>s.member_id===m.id&&(!month||scoreDate(s).startsWith(ym))),total=rows.reduce((n,s)=>n+Number(s.game1)+Number(s.game2)+Number(s.game3),0);return{total,games:rows.length*3,avg:rows.length?total/rows.length/3:0,attend:new Set(rows.map(s=>s.event_id)).size}}
function switchTab(id){tab=id;document.querySelectorAll('section').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===id));render()}
function render(){const logged=!!user;$('authBox').hidden=logged;$('signedBox').hidden=!logged;$('who').textContent=me?me.name+' · '+(isAdmin()?'관리자':me.approved?'승인 회원':'승인 대기'):logged?'회원 정보 확인 중':'로그인이 필요합니다';$('signedName').textContent=me?.name||user?.email||'';message(!logged?'로그인 후 기록을 확인할 수 있습니다.':!me?'회원 정보가 없습니다. 관리자에게 문의해 주세요.':!approved()?'가입 신청 상태입니다. 관리자 승인 후 점수를 입력할 수 있습니다.':'정기전 점수를 확인하고 입력할 수 있습니다.');
const month=$('period').value==='month',sort=$('sort').value,ranked=members.filter(m=>m.approved).map(m=>({m,s:stat(m,month)})).sort((a,b)=>b.s[sort]-a.s[sort]||a.m.name.localeCompare(b.m.name));
$('rankingList').innerHTML='<div class="rank"><b>회원</b><b>1G</b><b>2G</b><b>3G</b><b>AVG</b></div>'+ranked.map(({m,s},i)=>{const latest=scores.filter(r=>r.member_id===m.id).sort((a,b)=>scoreDate(b).localeCompare(scoreDate(a)))[0];return '<div class="rank"><span>'+(i+1)+'위 '+esc(m.name)+(m.phone?'<small class="muted"> '+esc(m.phone)+'</small>':'')+'<small class="muted"> ('+s.games+'G)</small></span>'+[1,2,3].map(j=>'<span>'+(latest?latest['game'+j]:'—')+'</span>').join('')+'<strong>'+(s.games?s.avg.toFixed(1):'—')+'</strong></div>'}).join('');
const old=$('eventSelect').value;$('eventSelect').innerHTML=events.slice().sort((a,b)=>dateOf(b).localeCompare(dateOf(a))).map(e=>'<option value="'+e.id+'">'+esc(dateOf(e))+' · '+(e.event_type==='lightning'?'번개전':'정기전')+'</option>').join('');if(events.some(e=>String(e.id)===old))$('eventSelect').value=old;
$('entryInfo').textContent=!approved()?'관리자 승인이 필요합니다.':!events.length?'등록된 정기전이 없습니다.':'정기전을 선택하고 3게임 점수를 입력하세요.';$('saveBtn').disabled=!approved()||!events.length;
const own=me?scores.filter(s=>s.member_id===me.id):[],s=me?stat(me):{avg:0,games:0,total:0};$('myStats').innerHTML=[['에버리지',s.avg.toFixed(1)],['게임수',s.games],['총핀',s.total]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');$('myHistory').innerHTML=own.slice().sort((a,b)=>scoreDate(b).localeCompare(scoreDate(a))).map(r=>'<div class="row"><span>'+esc(scoreDate(r))+' · '+[r.game1,r.game2,r.game3].join(' / ')+'</span><button class="alt" data-edit="'+r.event_id+'">수정</button></div>').join('');
$('phone').value=me?.phone||'';$('phonePublic').value=String(!!me?.phone_public);
$('pending').innerHTML=isAdmin()?members.filter(m=>!m.approved).map(m=>'<div class="row"><span>'+esc(m.name)+' · '+esc(m.phone||'')+'</span><button data-approve="'+m.id+'">승인</button></div>').join('')||'<p class="muted">승인 대기 회원 없음</p>':'<p class="muted">관리자 전용</p>';
$('adminScores').innerHTML=isAdmin()?scores.map(r=>'<div class="row"><span>'+esc(members.find(m=>m.id===r.member_id)?.name||'회원')+' · '+esc(scoreDate(r))+'<small class="muted"> '+[r.game1,r.game2,r.game3].join('/')+'</small></span><button class="alt" data-admin="'+r.member_id+'|'+r.event_id+'">수정</button></div>').join(''):'<p class="muted">관리자 전용</p>';
loadSelectedScore()}
function loadSelectedScore(){const r=scores.find(s=>me&&s.member_id===me.id&&String(s.event_id)===$('eventSelect').value);[1,2,3].forEach(j=>$('g'+j).value=r?r['game'+j]:'');preview()}
function preview(){const a=[1,2,3].map(j=>$('g'+j).value.trim());$('preview').textContent=a.every(v=>v!==''&&Number.isInteger(+v)&&+v>=0&&+v<=300)?(a.reduce((n,v)=>n+(+v),0)/3).toFixed(1):'—'}
async function refresh(){if(!db)return;fail('');try{const {data,error}=await db.auth.getUser();if(error&&error.message!=='Auth session missing!')fail('인증 확인: '+error.message);user=data?.user||null;if(!user){me=null;members=[];events=[];scores=[];render();return}const p=await db.from('club_members').select('*').eq('id',user.id).maybeSingle();if(p.error)fail('회원 조회: '+p.error.message);me=p.data;const [m,e,s]=await Promise.all([db.from('club_members').select('*'),db.from('club_events').select('*'),db.from('club_scores').select('*')]);members=m.data||[];events=e.data||[];scores=s.data||[];
if(!isAdmin()){
 const lb=await db.rpc('club_member_directory');
 if(lb.error)fail('전체 순위 조회: '+lb.error.message);
 else members=(lb.data||[]).map(x=>x.id===me?.id?me:x);
}for(const [label,r] of [['회원',m],['정기전',e],['점수',s]])if(r.error)fail(label+' 조회: '+r.error.message);render()}catch(e){fail('연결 오류: '+e.message)}}
async function signIn(legacy=false){if(!db)return alert('서버 연결 중입니다. 잠시 후 다시 시도하세요.');const id=legacy?$('legacyEmail').value.trim():phone($('loginId').value),password=$('loginPassword').value;if(!legacy&&!/^01[016789][0-9]{7,8}$/.test(id))return alert('휴대전화 번호를 확인하세요.');if(!password)return alert('비밀번호를 입력하세요.');const r=await db.auth.signInWithPassword({email:legacy?id:emailForPhone(id),password});if(r.error)return alert('로그인 실패: 전화번호 또는 비밀번호를 확인하세요.');await refresh()}
async function signUp(){if(!db)return alert('서버 연결 중입니다.');const name=$('joinName').value.trim(),p=phone($('joinPhone').value),password=$('joinPassword').value;if(name.length<2||!/^01[016789][0-9]{7,8}$/.test(p)||password.length<8)return alert('이름, 휴대전화 번호, 8자 이상 비밀번호를 확인하세요.');const r=await db.auth.signUp({email:emailForPhone(p),password,options:{data:{name,phone:p}}});if(r.error)return alert('가입 신청 실패: '+r.error.message);if(!r.data.session)return alert('계정은 생성됐지만 이메일 확인이 켜져 있습니다. 관리자에게 설정 변경을 요청하세요.');const save=await db.from('club_members').insert({id:r.data.user.id,name,phone:p,approved:false,is_admin:false,is_superadmin:false});if(save.error)return alert('계정 생성됨, 회원 정보 등록 실패: '+save.error.message);alert('가입 신청 완료! 관리자 승인 후 점수를 입력할 수 있습니다.');await refresh()}
async function save(){if(!approved())return alert('승인된 회원만 입력할 수 있습니다.');const eid=$('eventSelect').value,a=[1,2,3].map(j=>$('g'+j).value.trim());if(!eid||a.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>300))return alert('정기전과 세 게임 점수를 확인하세요.');const payload={game1:+a[0],game2:+a[1],game3:+a[2]},exists=scores.some(s=>s.member_id===me.id&&String(s.event_id)===eid);const r=exists?await db.from('club_scores').update(payload).eq('member_id',me.id).eq('event_id',eid):await db.from('club_scores').insert({...payload,member_id:me.id,event_id:eid});if(r.error)return alert('저장 실패: '+r.error.message);await refresh();switchTab('ranking');alert('점수가 저장됐습니다.')}
async function approve(id){if(!isAdmin())return;const r=await db.from('club_members').update({approved:true}).eq('id',id);if(r.error)return alert('승인 실패: '+r.error.message);await refresh();alert('승인 완료')}
async function newEvent(){if(!isAdmin())return alert('관리자 전용');const date=$('newDate').value,type=$('newType').value;if(!date)return alert('날짜를 선택하세요.');const r=await db.from('club_events').insert({event_date:date,event_type:type,title:type==='regular'?'정기전':'번개전'});if(r.error)return alert('정기전 등록 실패: '+r.error.message);await refresh();alert('정기전 등록 완료')}
async function adminScore(id,eid){if(!isAdmin())return;const old=scores.find(s=>s.member_id===id&&String(s.event_id)===eid);if(!old)return;const input=prompt('1게임,2게임,3게임', [old.game1,old.game2,old.game3].join(','));if(input===null)return;const a=input.split(',').map(x=>x.trim());if(a.length!==3||a.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>300))return alert('0~300점 3개를 입력하세요.');const r=await db.from('club_scores').update({game1:+a[0],game2:+a[1],game3:+a[2]}).eq('member_id',id).eq('event_id',eid);if(r.error)return alert('수정 실패: '+r.error.message);await refresh();alert('수정 완료')}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('loginBtn').onclick=()=>signIn(false);$('legacyBtn').onclick=()=>signIn(true);$('joinBtn').onclick=signUp;$('logoutBtn').onclick=async()=>{await db?.auth.signOut();await refresh()};$('period').onchange=render;$('sort').onchange=render;$('eventSelect').onchange=loadSelectedScore;[1,2,3].forEach(j=>$('g'+j).oninput=preview);$('saveBtn').onclick=save;$('newEventBtn').onclick=newEvent;$('profileBtn').onclick=async()=>{if(!me)return;const r=await db.from('club_members').update({phone_public:$('phonePublic').value==='true'}).eq('id',me.id);if(r.error)return alert(r.error.message);await refresh();alert('저장 완료')};$('pending').onclick=e=>{const b=e.target.closest('[data-approve]');if(b)approve(b.dataset.approve)};$('adminScores').onclick=e=>{const b=e.target.closest('[data-admin]');if(b){const [id,eid]=b.dataset.admin.split('|');adminScore(id,eid)}};$('myHistory').onclick=e=>{const b=e.target.closest('[data-edit]');if(b){switchTab('entry');$('eventSelect').value=b.dataset.edit;loadSelectedScore()}}}
function loadSdk(urls,i=0){if(i>=urls.length){fail('로그인 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}const s=document.createElement('script');s.src=urls[i];s.crossOrigin='anonymous';s.onload=()=>{try{if(!window.supabase?.createClient)return loadSdk(urls,i+1);db=window.supabase.createClient(SUPABASE_URL,KEY);db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(refresh,0)});refresh()}catch(e){fail('로그인 연결 오류: '+e.message)}};s.onerror=()=>loadSdk(urls,i+1);document.head.appendChild(s)}
window.addEventListener('error',e=>{if(e.message==='Script error.')return;fail('화면 오류: '+(e.message||'알 수 없는 오류'))});window.addEventListener('unhandledrejection',e=>fail('처리 오류: '+(e.reason?.message||String(e.reason))));bind();render();message('로그인 서버 연결 중...');loadSdk(['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js']);
</script></body></html>
