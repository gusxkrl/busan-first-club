<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산 퍼스트클럽</title><meta name="theme-color" content="#102b55"><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#182943;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#102b55;color:white;padding:24px 18px;border-radius:0 0 22px 22px}header>div,.wrap{max-width:550px;margin:auto}.wrap{padding:16px 14px 70px}h1{font-size:25px;margin:4px 0}h2{font-size:18px;margin:0 0 14px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #102b5514}.muted{font-size:13px;color:#68758a}.notice{background:#fff4d8;padding:13px;border-radius:12px;font-size:13px;line-height:1.5}input,select,button{font:inherit}input,select{display:block;width:100%;border:1px solid #cbd6e6;border-radius:10px;padding:11px;margin:6px 0 13px}label{font-size:13px;font-weight:700}button{border:0;border-radius:10px;padding:11px 13px;background:#175bb8;color:white;cursor:pointer}button.secondary{background:#e9eff9;color:#193c6d}button:disabled{opacity:.45}nav{display:flex;gap:5px;overflow:auto;margin:12px 0}nav button{white-space:nowrap;flex:1;padding:10px 7px;font-size:13px}nav button.selected{background:#102b55}section{display:none}section.active{display:block}.inline{display:flex;gap:8px}.inline>*{flex:1;min-width:0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #e9edf4;padding:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eef4fd;padding:12px 7px;border-radius:11px;text-align:center}.stat strong{display:block;font-size:19px;margin-top:5px}.rank{display:grid;grid-template-columns:minmax(85px,1.6fr) repeat(3,minmax(34px,1fr)) minmax(50px,1fr);gap:4px;align-items:center;text-align:center;padding:12px 0;border-bottom:1px solid #e8edf5;font-size:12px}.rank>span:first-child{text-align:left;overflow-wrap:anywhere}.rank.head{font-weight:700;color:#63718a}.rank b{color:#175bb8}.error{color:#b32121;white-space:pre-wrap;font-size:13px}details{margin-top:15px}summary{cursor:pointer;font-weight:700}dialog{border:0;border-radius:15px;width:min(92%,450px);padding:20px}dialog::backdrop{background:#0008}[hidden]{display:none!important}
</style></head><body><header><div><small>BUSAN 1ST BOWLING CLUB</small><h1>🎳 부산 퍼스트클럽</h1><div id="who">화면 준비 완료 · 로그인 연결 확인 중</div></div></header><main class="wrap"><div id="notice" class="notice">로그인 연결을 확인하고 있습니다.</div><div id="error" class="error" role="alert"></div><div id="authBox" class="card"><h2>회원 로그인</h2><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="가입한 이메일"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="inline"><button id="loginBtn" type="button">로그인</button><button id="resetMailBtn" class="secondary" type="button">비밀번호 찾기</button></div><details><summary>신규 회원 가입 신청</summary><p class="muted">관리자 승인 후 점수를 입력할 수 있습니다.</p><label>이름</label><input id="joinName" placeholder="실명"><label>전화번호</label><input id="joinPhone" type="tel" placeholder="010-0000-0000"><button id="joinBtn" type="button">가입 신청</button></details></div><div id="signedBox" class="card" hidden><div class="row"><strong id="signedName"></strong><button class="secondary" id="logoutBtn">로그아웃</button></div></div><nav><button class="selected" data-tab="ranking">전체 순위</button><button data-tab="entry">점수 입력</button><button data-tab="history">개인 기록</button><button data-tab="profile">프로필</button><button data-tab="manage">관리</button></nav><section id="ranking" class="active"><div class="card"><h2>전체 회원 순위</h2><div class="inline"><select id="period"><option value="all">전체 기간</option><option value="month">이번 달</option></select><select id="sort"><option value="avg">에버리지순</option><option value="total">총핀순</option><option value="games">게임수순</option><option value="attend">참석횟수순</option></select></div><div id="rankingList"></div><p class="muted">서버에 등록된 점수 기준입니다. 기존 시제품의 기기별 누적 점수는 자동 합산되지 않습니다.</p></div></section><section id="entry"><div class="card"><h2>내 점수 입력·수정</h2><p id="entryInfo" class="muted">로그인 후 이용하세요.</p><label>정기전 선택</label><select id="eventSelect"></select><div class="inline"><div><label>1게임</label><input id="g1" type="number" min="0" max="300"></div><div><label>2게임</label><input id="g2" type="number" min="0" max="300"></div><div><label>3게임</label><input id="g3" type="number" min="0" max="300"></div></div><p>에버리지: <strong id="preview">—</strong></p><button id="saveBtn" style="width:100%" disabled>점수 저장</button></div></section><section id="history"><div class="card"><h2>내 기록</h2><div id="myStats" class="stats"></div><div id="myHistory"></div></div></section><section id="profile"><div class="card"><h2>내 프로필</h2><label>연락처</label><input id="phone" type="tel"><label>연락처 공개</label><select id="phonePublic"><option value="false">비공개</option><option value="true">공개</option></select><button id="profileBtn">프로필 저장</button></div><div class="card"><h2>최근 6개월 에버리지</h2><div id="monthly"></div></div></section><section id="manage"><div class="card" id="adminPanel"><h2>관리자 전용</h2></div></section></main><dialog id="detail"><div id="detailText"></div><button class="secondary" id="closeDetail">닫기</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SB_URL='https://vgcxhwrnedmzlmbzjext.supabase.co',SB_KEY='sb_publishable_gNdMi8-eDPjfCrq1-txE6A_DMZxH6KJ';
let db=null,user=null,me=null,members=[],events=[],scores=[],currentTab='ranking';
const isAdmin=()=>!!(me&&(me.is_admin||me.is_superadmin)),approved=()=>!!(me&&(me.approved||isAdmin()));
const eventDate=e=>String(e?.event_date??e?.date??e?.meeting_date??e?.held_on??e?.start_date??'').slice(0,10),eventName=e=>eventDate(e)||String(e?.title??e?.name??('정기전 #'+e?.id));
const eventById=id=>events.find(e=>String(e.id)===String(id)),scoreDate=s=>eventDate(eventById(s.event_id));
function message(s){$('notice').textContent=s}function fail(s){$('error').textContent=s||''}
function monthKey(offset){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function stat(m,period='all',ym=''){const rows=scores.filter(s=>s.member_id===m.id&&(period==='all'||scoreDate(s).startsWith(ym)));const total=rows.reduce((v,s)=>v+Number(s.game1)+Number(s.game2)+Number(s.game3),0);return {total,games:rows.length*3,avg:rows.length?total/rows.length/3:0,attend:new Set(rows.map(s=>s.event_id)).size}}
function switchTab(id){currentTab=id;document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('selected',x.dataset.tab===id));render()}
function render(){const logged=!!user;$('authBox').hidden=logged;$('signedBox').hidden=!logged;$('who').textContent=me?me.name+' · '+(me.is_superadmin?'최고 관리자':me.is_admin?'관리자':me.approved?'승인 회원':'승인 대기'):logged?'회원 정보 확인 중':'로그인이 필요합니다';$('signedName').textContent=me?.name||user?.email||'';
if(db)message(!logged?'로그인 후 이용할 수 있습니다.':!me?'회원 정보가 없습니다. 관리자에게 문의하세요.':!approved()?'관리자 승인 대기 중입니다.':'서버에 저장된 정기전 점수를 확인할 수 있습니다.');
const period=$('period').value,ym=monthKey(0),sort=$('sort').value,ranked=members.filter(m=>m.approved).map(m=>({m,s:stat(m,period,ym)})).sort((a,b)=>b.s[sort]-a.s[sort]||String(a.m.name).localeCompare(String(b.m.name)));
$('rankingList').innerHTML='<div class="rank head"><span>회원</span><span>1G</span><span>2G</span><span>3G</span><span>AVG</span></div>'+ranked.map(({m,s},i)=>{const latest=scores.filter(r=>r.member_id===m.id).sort((a,b)=>scoreDate(b).localeCompare(scoreDate(a)))[0];return '<div class="rank"><span><b>'+(i+1)+'위</b> '+esc(m.name)+'<div class="muted">'+s.games+'게임 · '+s.attend+'회</div></span>'+[1,2,3].map(j=>'<span>'+(latest?latest['game'+j]:'—')+'</span>').join('')+'<b>'+(s.games?s.avg.toFixed(1):'—')+'</b></div>'}).join('');
const options=events.slice().sort((a,b)=>eventDate(b).localeCompare(eventDate(a))),prev=$('eventSelect').value;$('eventSelect').innerHTML=options.map(e=>'<option value="'+esc(e.id)+'">'+esc(eventName(e))+'</option>').join('');if(options.some(e=>String(e.id)===prev))$('eventSelect').value=prev;
$('entryInfo').textContent=!approved()?'승인된 회원만 입력할 수 있습니다.':options.length?'정기전을 선택하세요.':'등록된 정기전이 없습니다. 관리자에게 등록을 요청하세요.';$('saveBtn').disabled=!approved()||!options.length;
const own=me?scores.filter(s=>s.member_id===me.id):[],s=me?stat(me):{total:0,games:0,avg:0};$('myStats').innerHTML=[['에버리지',s.avg.toFixed(1)],['게임수',s.games],['총핀',s.total.toLocaleString()]].map(x=>'<div class="stat"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');$('myHistory').innerHTML='<h2 style="margin-top:20px">날짜별 기록</h2>'+own.slice().sort((a,b)=>scoreDate(b).localeCompare(scoreDate(a))).map(r=>'<div class="row"><div>'+esc(eventName(eventById(r.event_id)))+'<div class="muted">'+[r.game1,r.game2,r.game3].join(' / ')+'</div></div><button class="secondary" data-edit="'+esc(r.event_id)+'">수정</button></div>').join('');
$('phone').value=me?.phone||'';$('phonePublic').value=String(!!me?.phone_public);$('monthly').innerHTML=me?Array.from({length:6},(_,i)=>{const ym=monthKey(i-5),v=stat(me,'month',ym);return '<div class="row"><span>'+ym+'</span><strong>'+(v.games?v.avg.toFixed(1)+'점':'기록 없음')+'</strong></div>'}).join(''):'';
$('adminPanel').innerHTML=isAdmin()?'<h2>회원 승인</h2>'+members.filter(m=>!m.approved).map(m=>'<div class="row"><span>'+esc(m.name)+'</span><button data-approve="'+esc(m.id)+'">승인</button></div>').join('')+'<h2>점수 수정</h2>'+scores.map(r=>'<div class="row"><span>'+esc(members.find(m=>m.id===r.member_id)?.name||'회원')+' · '+esc(eventName(eventById(r.event_id)))+' · '+[r.game1,r.game2,r.game3].join('/')+'</span><button data-admin-score="'+esc(r.member_id)+'|'+esc(r.event_id)+'">수정</button></div>').join(''):'<h2>관리자 전용</h2><p>관리 권한이 없습니다.</p>';
loadSelectedScore()}
function loadSelectedScore(){const r=scores.find(s=>me&&s.member_id===me.id&&String(s.event_id)===$('eventSelect').value);[1,2,3].forEach(j=>$('g'+j).value=r?r['game'+j]:'');preview()}
function preview(){const a=[1,2,3].map(j=>$('g'+j).value.trim());$('preview').textContent=a.every(v=>v!==''&&Number.isInteger(+v)&&+v>=0&&+v<=300)?(a.reduce((n,v)=>n+(+v),0)/3).toFixed(1):'—'}
async function refresh(){if(!db)return;fail('');try{const r=await db.auth.getUser();if(r.error)fail('인증 확인: '+r.error.message);user=r.data.user;if(!user){me=null;members=[];events=[];scores=[];render();return}const p=await db.from('club_members').select('*').eq('id',user.id).maybeSingle();me=p.data;if(p.error)fail('회원 조회: '+p.error.message);const [m,e,s]=await Promise.all([db.from('club_members').select('*'),db.from('club_events').select('*'),db.from('club_scores').select('*')]);members=m.data||[];events=e.data||[];scores=s.data||[];for(const [label,r] of [['회원',m],['정기전',e],['점수',s]])if(r.error)fail(label+' 조회 오류: '+r.error.message);render()}catch(e){fail('서버 연결 오류: '+e.message)}}
async function signIn(){if(!db)return fail('로그인 연결을 불러오지 못했습니다.');if(!$('email').value.trim()||!$('password').value)return fail('이메일과 비밀번호를 입력해 주세요.');$('loginBtn').disabled=true;$('loginBtn').textContent='로그인 중...';fail('');try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)fail('로그인 실패: '+r.error.message);else await refresh()}catch(e){fail('로그인 연결 오류: '+e.message)}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='로그인'}}
async function signUp(){if(!db)return fail('서버 연결이 필요합니다.');const name=$('joinName').value.trim(),phone=$('joinPhone').value.trim(),email=$('email').value.trim(),password=$('password').value;if(!name||!phone||!email||password.length<8)return fail('이름·전화번호·이메일·8자 이상 비밀번호를 입력하세요.');try{const r=await db.auth.signUp({email,password,options:{data:{name,phone}}});if(r.error)return fail('가입 실패: '+r.error.message);if(r.data.session&&r.data.user){const p=await db.from('club_members').upsert({id:r.data.user.id,name,phone,approved:false},{onConflict:'id'});if(p.error)return fail('회원 등록 오류: '+p.error.message)}message('가입 신청 접수. 이메일 인증과 관리자 승인이 필요할 수 있습니다.');await refresh()}catch(e){fail(e.message)}}
async function resetMail(){if(!db)return fail('서버 연결이 필요합니다.');const email=$('email').value.trim();if(!email)return fail('이메일을 입력해 주세요.');const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});fail(r.error?r.error.message:'비밀번호 재설정 메일을 확인하세요.')}
async function save(){if(!approved())return fail('승인된 회원만 입력할 수 있습니다.');const id=$('eventSelect').value,raw=[1,2,3].map(j=>$('g'+j).value.trim());if(!id||raw.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>300))return fail('정기전과 0~300점의 세 게임 점수를 확인하세요.');const payload={game1:+raw[0],game2:+raw[1],game3:+raw[2]},exists=scores.some(s=>s.member_id===me.id&&String(s.event_id)===id);const r=exists?await db.from('club_scores').update(payload).eq('event_id',id).eq('member_id',me.id):await db.from('club_scores').insert({...payload,event_id:id,member_id:me.id});if(r.error)return fail('점수 저장 실패: '+r.error.message);await refresh();switchTab('ranking');message('점수가 서버에 저장되었습니다.')}
async function approveMember(id){if(!isAdmin())return;const r=await db.from('club_members').update({approved:true}).eq('id',id);if(r.error)return fail('승인 실패: '+r.error.message);await refresh()}
async function adminScore(id,eid){if(!isAdmin())return;const old=scores.find(s=>s.member_id===id&&String(s.event_id)===eid);if(!old)return;const input=prompt('1,2,3게임 점수 (쉼표 구분)',[old.game1,old.game2,old.game3].join(','));if(input===null)return;const a=input.split(',').map(x=>x.trim());if(a.length!==3||a.some(v=>v===''||!Number.isInteger(+v)||+v<0||+v>300))return fail('0~300점 세 개를 입력하세요.');const r=await db.from('club_scores').update({game1:+a[0],game2:+a[1],game3:+a[2]}).eq('member_id',id).eq('event_id',eid);if(r.error)return fail('수정 실패: '+r.error.message);await refresh()}
async function saveProfile(){if(!me)return fail('로그인해 주세요.');const r=await db.from('club_members').update({phone:$('phone').value.trim(),phone_public:$('phonePublic').value==='true'}).eq('id',me.id);if(r.error)return fail(r.error.message);await refresh();message('프로필이 저장되었습니다.')}
function bind(){document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));$('period').onchange=render;$('sort').onchange=render;$('eventSelect').onchange=loadSelectedScore;[1,2,3].forEach(j=>$('g'+j).oninput=preview);$('saveBtn').onclick=save;$('loginBtn').onclick=signIn;$('joinBtn').onclick=signUp;$('resetMailBtn').onclick=resetMail;$('logoutBtn').onclick=async()=>{if(db)await db.auth.signOut();await refresh()};$('profileBtn').onclick=saveProfile;$('closeDetail').onclick=()=>$('detail').close();$('myHistory').onclick=e=>{const b=e.target.closest('[data-edit]');if(b){switchTab('entry');$('eventSelect').value=b.dataset.edit;loadSelectedScore()}};$('adminPanel').onclick=e=>{const a=e.target.closest('[data-approve]');if(a)return approveMember(a.dataset.approve);const b=e.target.closest('[data-admin-score]');if(b){const [id,eid]=b.dataset.adminScore.split('|');adminScore(id,eid)}}}
function loadSdk(urls,i=0){if(i>=urls.length){fail('로그인 프로그램을 불러오지 못했습니다. 네트워크 또는 브라우저 차단 문제입니다.');message('메뉴는 이용할 수 있지만 서버 연결에 실패했습니다.');return}const script=document.createElement('script');script.src=urls[i];script.onload=()=>{if(!window.supabase?.createClient)return loadSdk(urls,i+1);try{db=window.supabase.createClient(SB_URL,SB_KEY);db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(refresh,0)});refresh()}catch(e){fail('초기화 실패: '+e.message)}};script.onerror=()=>loadSdk(urls,i+1);document.head.appendChild(script)}
window.addEventListener('error',e=>fail('화면 실행 오류: '+e.message));window.addEventListener('unhandledrejection',e=>fail('처리 오류: '+(e.reason?.message||String(e.reason))));
bind();render();message('화면 준비 완료. 로그인 서버 연결 중...');loadSdk(['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js']);
</script></body></html>
